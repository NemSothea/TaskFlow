name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Test-only values. Real secrets never live in this file.
  DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
  DEBUG: "False"
  ALLOWED_HOSTS: localhost,127.0.0.1
  SECURE_COOKIES: "False"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://taskflow:taskflow_ci@127.0.0.1:5432/taskflow
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: scripts/check-backend.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: scripts/check-frontend.sh

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskflow_e2e
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://taskflow:taskflow_ci@127.0.0.1:5432/taskflow_e2e
      DATABASE_URL: postgres://taskflow:taskflow_ci@127.0.0.1:5432/taskflow_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync && uv run python manage.py migrate --no-input
        working-directory: backend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
